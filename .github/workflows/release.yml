name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # consumed by the ldflags in .goreleaser.yaml (same fields the Dockerfile fills)
      - name: Collect build metadata
        run: |
          echo "GO_VERSION=$(go version)" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=$(uname -srmo)" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # release exactly the tag that triggered this run, even when other
          # tags (e.g. the last pre-release) point at the same commit
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
